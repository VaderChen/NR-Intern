openapi: 3.1.0
info:
  title: 永不休息的實習生 HTTP API
  version: 0.1.0
  description: 後端可獨立執行的 Harness AI Agent API；Run 採非同步執行，事件可持久化重播。
servers:
  - url: http://127.0.0.1:8787
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      summary: Process health
      security: []
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
  /readyz:
    get:
      summary: Application readiness
      security: []
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/openapi.yaml:
    get:
      summary: 取得本 OpenAPI 契約
      responses:
        "200":
          description: OpenAPI YAML
          content:
            application/yaml:
              schema: { type: string }
  /api/v1/admin/status:
    get:
      summary: 取得服務狀態與 API 相容資訊
      description: 回傳 API major version、事件 schema version 與前端可檢查的後端 capabilities。
      responses:
        "200":
          description: 服務狀態
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceStatusEnvelope" }
  /api/v1/admin/diagnostics:
    get:
      summary: 取得脫敏後台診斷
      description: 不包含 HTTP token、LLM API key、SSH 密碼、passphrase 或私鑰內容。
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/admin/diagnostics/export:
    get:
      summary: 匯出脫敏診斷包
      description: 匯出 JSON 診斷摘要，不包含 API key、OAuth token、MCP/NetPass 憑證、對話全文或 DataDir 絕對路徑。
      responses:
        "200":
          description: JSON diagnostics download
          content:
            application/json: { schema: { type: string } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/admin/backup:
    get:
      summary: 下載安全備份
      description: 備份使用者資料與對話記錄；Provider、OAuth、MCP 與 NetPass 憑證檔案一律排除。
      responses:
        "200":
          description: ZIP backup
          content:
            application/zip: { schema: { type: string, format: binary } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/admin/config-bundle:
    get:
      summary: 下載設定包（Provider、MCP、反向代理與服務設定）
      description: >-
        只收錄 data_dir 已存在的 providers.json、mcp-servers.json、netpass.json、service-settings.json
        與產生的 manifest.json，不含對話、附件、OAuth token 檔或環境變數。
        依秘密欄位名稱清除字串或字串陣列，Header／environment／env 物件的值清為空字串；
        manifest.json 列出被遮蔽的欄位。URL、帳號、路徑與命令列參數仍可能含敏感資料，分享前須人工檢查。
        此端點只有匯出，不可交給安全備份還原端點匯入。
      responses:
        "200":
          description: 設定 ZIP 壓縮檔；即使沒有設定檔仍含 manifest.json。
          headers:
            Content-Disposition:
              description: 建議下載檔名。
              schema: { type: string, example: 'attachment; filename="nr-intern-config.zip"' }
          content:
            application/zip:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/admin/restore:
    post:
      summary: 還原安全備份
      description: 只接受固定資料目錄內的安全 ZIP 路徑；還原前會保存 pre-restore 備份，完成後必須重啟後端。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
          application/zip: { schema: { type: string, format: binary } }
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/admin/permissions:
    get:
      summary: 取得唯讀權限中心
      description: 回傳後端 permission policy、工具權限與待人工核准 Run 數量；不提供自我提權操作。
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/admin/update:
    get:
      summary: 取得最近一次更新檢查結果
      description: 回傳目前版本、最近一次 GitHub Release 與更新可用性；尚未檢查時只回傳目前版本。
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/admin/update/check:
    post:
      summary: 立即檢查 GitHub Release 更新
      description: 只檢查固定的 VaderChen/NR-Intern 官方 Release，不接受呼叫端提供 URL；網路錯誤會在資料中回傳 check_error。
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/notifications:
    get:
      summary: 取得通知中心
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: unread_only
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/notifications/{notification_id}/read:
    post:
      summary: 將一則通知標為已讀
      parameters:
        - name: notification_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/notifications/read-all:
    post:
      summary: 將所有通知標為已讀
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/notifications/read:
    delete:
      summary: 清除已讀通知
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/search:
    get:
      summary: 全域搜尋
      description: 搜尋 Workspace、Project、Session、Message、Plan 與 Schedule，回傳最多 100 筆短摘要。
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/admin/service-settings:
    get:
      summary: 取得服務顯示設定
      responses:
        "200":
          description: 服務顯示設定
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceSettingsEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      summary: 持久化並立即套用服務顯示名稱
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateServiceSettingsInput" }
      responses:
        "200":
          description: 已套用的服務顯示設定
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceSettingsEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/admin/provider-settings:
    get:
      summary: 取得可編輯的 Provider 設定
      description: API Key 與 ChatGPT/Codex OAuth Token 僅以 has_api_key／has_oauth_token 回報，永遠不傳回明文。
      responses:
        "200":
          description: Provider 設定
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderSettingsEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      summary: 驗證、持久化並立即套用完整 Provider 集合
      description: >-
        openai_compatible.api_key 省略時保留既有值，空字串表示清除。
        ChatGPT/Codex OAuth 使用內建公開 Client ID；Token 由獨立的權限限制檔案管理。
        仍被 Workspace 引用的 Provider 不可移除。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProviderSettingsInput" }
      responses:
        "200":
          description: 已套用的脫敏設定
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderSettingsEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/admin/provider-settings/{provider_id}/models:
    get:
      summary: 更新指定 Provider 的可用模型列表
      description: OpenAI-compatible 會呼叫 models 端點；OpenAI Codex Responses 不提供模型目錄並回傳空清單，UI 以「-」表示。
      parameters:
        - name: provider_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Provider 模型目錄
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderModelsEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/admin/provider-settings/{provider_id}/test:
    post:
      summary: 測試指定 Provider 的實際模型請求
      description: 依 Provider 類型執行最小 Chat Completions 或 Codex Responses 請求，成功後一併嘗試更新模型列表。
      parameters:
        - name: provider_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Provider 測試成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderTestResultEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/admin/provider-settings/{provider_id}/oauth/start:
    post:
      summary: 啟動 ChatGPT/Codex OAuth PKCE 驗證
      description: 啟動僅監聽 loopback 的臨時 HTTP callback server，再開啟 ChatGPT 登入頁。此 API 不回傳任何 Token。
      parameters:
        - name: provider_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OAuth 驗證已啟動
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderOAuthStartEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/admin/provider-settings/{provider_id}/oauth/status:
    get:
      summary: 取得脫敏的 ChatGPT/Codex OAuth 狀態
      parameters:
        - name: provider_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OAuth 狀態，不包含 access token 或 refresh token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderOAuthStatusEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/admin/provider-settings/{provider_id}/oauth:
    delete:
      summary: 中斷 ChatGPT/Codex OAuth 並刪除該 Provider 的 Token
      parameters:
        - name: provider_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: 已中斷 OAuth }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/admin/mcp-settings:
    get:
      summary: 取得 MCP Client 設定與連線狀態
      description: API Key、Basic Auth 帳密、Environment 與 HTTP Headers 只回報是否已設定，不傳回明文。
      responses:
        "200":
          description: MCP Server 設定
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPSettingsEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      summary: 驗證、持久化並立即套用完整 MCP Server 集合
      description: API Key、Basic Auth 帳密、Environment 與 Headers 省略時保留既有值；敏感欄位傳入空值或清除標記時清除。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMCPSettingsInput" }
      responses:
        "200":
          description: 已套用的脫敏 MCP 設定
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPSettingsEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/admin/mcp-settings/{mcp_id}/test:
    post:
      summary: 重新連線 MCP Server 並刷新工具清單
      parameters:
        - name: mcp_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: MCP 連線測試結果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPTestResultEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/admin/reverse-proxy:
    get:
      summary: 取得 NetPass 反向代理設定與執行狀態
      description: 僅回傳脫敏狀態，不包含 NetPass API Key、Runtime 路徑或子程序輸出。
      responses:
        "200":
          description: 反向代理狀態
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReverseProxyStatusEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      summary: 儲存 NetPass 反向代理設定
      description: API Key 留白時保留既有值；clear_api_key 為 true 時清除。執行中不可修改設定。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateReverseProxyInput" }
      responses:
        "200":
          description: 已儲存的脫敏設定
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReverseProxyStatusEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/admin/reverse-proxy/start:
    post:
      summary: 啟動 NetPass 反向代理
      description: >-
        只將後端 API Port 暴露到 NetPass，不公開桌面 UI。
        呼叫前必須已設定 NetPass API Key，並明確接受使用政策。
        NetPass 不代替後端認證；公開前應另外設定 api_token。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartReverseProxyInput" }
      responses:
        "200":
          description: NetPassClient 已啟動
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReverseProxyStatusEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/admin/reverse-proxy/stop:
    post:
      summary: 停止 NetPass 反向代理
      responses:
        "200":
          description: NetPassClient 已停止
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReverseProxyStatusEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/tools:
    get:
      summary: 查詢內建與 MCP 工具目錄及可用性
      parameters:
        - name: session_id
          in: query
          schema: { type: string }
          description: 提供後會一併判斷該 Session 的 permission profile。
      responses:
        "200":
          description: 工具目錄
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ToolCatalogEntry" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/providers:
    get:
      summary: 列出已註冊 Provider adapters
      description: 回傳目前已啟用且可供 Workspace 與 Session 使用的 Provider。
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
  /api/v1/providers/{provider_id}/capabilities:
    parameters:
      - in: path
        name: provider_id
        required: true
        schema: { type: string }
      - in: query
        name: model
        schema: { type: string }
    get:
      summary: 取得指定 Provider 與模型的能力限制
      description: 回傳實際套用的 context window、最大輸出、Streaming 與工具支援設定；0 代表未宣告。
      responses:
        "200":
          description: 模型能力限制
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelCapabilitiesEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/providers/{provider_id}/usage:
    parameters:
      - in: path
        name: provider_id
        required: true
        schema: { type: string }
    get:
      summary: 取得 Provider 最近一次配額快照
      description: 僅回傳上游實際提供的 5 小時與 7 天視窗；available=false 代表沒有資料。
      responses:
        "200":
          description: Provider 用量快照
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderUsageEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/workspaces:
    get:
      summary: 列出 Workspaces
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      summary: 建立 Workspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkspaceInput" }
      responses:
        "201":
          description: 已建立
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/workspaces/{workspace_id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      summary: 取得 Workspace
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      summary: 更新 Workspace 的 Provider 集合、預設 Provider 與模型
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWorkspaceInput" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      summary: 刪除空 Workspace
      description: 仍含 Project 或 Session，以及系統最後一個 Workspace 時，回傳 409。
      responses:
        "204": { description: 已刪除 }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/projects:
    get:
      summary: 列出結構化 Projects
      parameters:
        - name: workspace_id
          in: query
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      summary: 建立 Project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectInput" }
      responses:
        "201":
          description: 已建立
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/projects/{project_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      summary: 取得 Project
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      summary: 更新 Project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectInput" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      summary: 刪除 Project
      description: >-
        預設只刪空的 Project：仍有 Session 時回傳 409，不會隱含級聯刪除——那些 Session 是使用者的
        工作紀錄，不該因為刪一個分類就一起消失。force=true 才連同底下的 Session 一起永久刪除，
        供管理介面的「強制刪除」使用。只有字面上的 true 會級聯，其餘值（含 1、yes、空字串）一律視為未指定。
      parameters:
        - name: force
          in: query
          description: 設為 true 時連同 Project 底下的所有 Session 一起刪除。
          schema: { type: boolean, default: false }
      responses:
        "204": { description: 已刪除 }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/schedules:
    get:
      summary: 列出排程
      description: 排程是 Workspace 層級的獨立實體，不隸屬於任何 Project 或 Session。
      parameters:
        - name: workspace_id
          in: query
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      summary: 建立排程
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateScheduleInput" }
      responses:
        "201":
          description: 已建立
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/schedules/{schedule_id}:
    parameters:
      - $ref: "#/components/parameters/ScheduleID"
    get:
      summary: 取得排程
      responses:
        "200":
          description: 排程
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      summary: 更新排程
      description: 變更 recurrence 或 enabled 時，next_run_at 會立即重新計算。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateScheduleInput" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      summary: 刪除排程
      description: 已由排程建立的 Session 會保留。
      responses:
        "204": { description: 已刪除 }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/schedules/{schedule_id}/run:
    parameters:
      - $ref: "#/components/parameters/ScheduleID"
    post:
      summary: 立刻執行一次排程
      description: 建立新的 Session 與 Run；排程原本的 next_run_at 不變。
      responses:
        "202":
          description: 已建立 Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/agents:
    get:
      summary: 列出 Agent
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
  /api/v1/agents/{agent_id}:
    parameters:
      - $ref: "#/components/parameters/AgentID"
    get:
      summary: 取得 Agent 描述
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/agents/{agent_id}/sessions:
    parameters:
      - $ref: "#/components/parameters/AgentID"
    get:
      summary: 列出 Agent Sessions
      parameters:
        - name: workspace_id
          in: query
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      summary: 建立 Session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSessionInput" }
      responses:
        "201":
          description: 已建立
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/agents/{agent_id}/sessions/order:
    parameters:
      - $ref: "#/components/parameters/AgentID"
    put:
      summary: 調整同一專案內的對話順序
      description: 必須提交同一 Workspace、同一 Project 內全部未釘選 Session ID；此操作不會搬移 Session。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReorderSessionsInput" }
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      summary: 取得 Session
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      summary: 更新 Session 管理欄位
      description: workspace_root 不可透過此 API 修改。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSessionInput" }
      responses:
        "200":
          description: 已更新 Session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      summary: 刪除 Session 與 workspace
      responses:
        "204": { description: 已刪除 }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/sessions/{session_id}/messages:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      summary: 取得 Session 訊息
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/sessions/{session_id}/messages/{message_id}/retract:
    parameters:
      - $ref: "#/components/parameters/SessionID"
      - name: message_id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: 撤回最後一則使用者訊息與其後的內容（重新提問）
      description: >-
        把指定訊息與其後的回答、工具過程移出對話，回傳剩下的訊息。只接受目前對話的最後一則使用者訊息；
        有排隊或執行中的 Run 時回傳 409。transcript 不會被刪除，只追加一筆 messages_retracted 記錄供稽核。
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/sessions/{session_id}/plan:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      summary: 取得 Session 計畫
      description: 尚未建立計畫時 data 為 null。
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      summary: 由使用者建立或完整取代 Session 目前計畫（相容端點）
      description: Run 正在排隊或執行時不可取代計畫。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePlanInput" }
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      summary: 刪除 Session 目前計畫（相容端點）
      responses:
        "204": { description: 已刪除 }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/sessions/{session_id}/plans:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      summary: 取得 Session 的有序計畫列表
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      summary: 在 Session 計畫佇列尾端新增計畫
      description: 第一份未完成計畫會執行，後續計畫保持 queued；Run 正在排隊或執行時不可新增。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePlanInput" }
      responses:
        "201": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/sessions/{session_id}/plans/order:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    put:
      summary: 調整 Session 計畫執行順序
      description: 必須提供完整且不重複的計畫 ID；已開始執行的計畫不可移到其他未完成計畫之後。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReorderPlansInput" }
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/sessions/{session_id}/plans/{plan_id}:
    parameters:
      - $ref: "#/components/parameters/SessionID"
      - name: plan_id
        in: path
        required: true
        schema: { type: string }
    put:
      summary: 重建指定計畫
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePlanInput" }
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      summary: 刪除指定計畫
      responses:
        "204": { description: 已刪除 }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/sessions/{session_id}/attachments:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      summary: 上傳對話附件到 Session 私有工作目錄
      description: Client 之後只需把回傳的 attachment id 放入 RunInput；不能自行指定主機路徑。單檔預設上限 8 MiB，一次最多 16 個。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  maxItems: 16
                  items: { type: string, format: binary }
      responses:
        "201":
          description: 已儲存附件
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Attachment" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/sessions/{session_id}/entries:
    parameters:
      - $ref: "#/components/parameters/SessionID"
      - name: after_sequence
        in: query
        schema: { type: integer, format: int64, minimum: 0, default: 0 }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
    get:
      summary: 分頁取得完整 Session 稽核 entries
      description: 依 after_sequence 與 limit 在儲存層定位讀取，回應含 next_after_sequence 與 has_more。位置索引只存在記憶體；讀取來源為 transcript，不受 Run 事件檔保留期限影響。
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/sessions/{session_id}/runs:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      summary: 列出 Session Runs
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
    post:
      summary: 建立非同步 Run
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunInput" }
      responses:
        "202":
          description: Run 已排入執行
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  "/api/v1/sessions/{session_id}/runs:stream":
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      summary: 建立 Run 並串流 durable SSE events
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/LastEventID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunInput" }
      responses:
        "200":
          description: SSE event stream
          headers:
            X-Run-ID: { schema: { type: string } }
            Location: { schema: { type: string } }
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/runs:
    get:
      summary: 列出 Runs
      parameters:
        - name: session_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          description: 逗號分隔的狀態過濾，例如 waiting_approval,running。未指定時回傳全部。
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/memories:
    get:
      summary: 搜尋長期記憶
      description: 未指定 scope 時使用後端預設 scope。scope=all 會跨所有 scope 列出目前生效的記憶（最近更新在前），管理介面用它在不知道 scope 的情況下呈現 Agent 記住了什麼；此時 q、kinds 與 tags 不適用。記憶被遺忘後不再出現在結果中。
      parameters:
        - name: scope
          in: query
          description: 記憶範圍；填入 all 代表跨所有 scope 列出。
          schema: { type: string }
        - name: q
          in: query
          description: 詞彙比對查詢字串。
          schema: { type: string }
        - name: kinds
          in: query
          description: 逗號分隔，可用值 fact,preference,decision,procedure,constraint。
          schema: { type: string }
        - name: tags
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      summary: 寫入長期記憶
      description: 由使用者直接寫入，metadata.source 會標記為 operator，以與 Agent 自行寫入的記憶區分。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RememberMemoryInput" }
      responses:
        "201": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/memories/{memory_id}:
    parameters:
      - name: memory_id
        in: path
        required: true
        schema: { type: string }
      - name: scope
        in: query
        schema: { type: string }
    get:
      summary: 取得單筆長期記憶
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      summary: 軟性遺忘一筆長期記憶
      description: 記憶保留稽核資訊但不再被召回，因此回傳更新後的內容而非空回應。
      parameters:
        - name: reason
          in: query
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/sessions/{session_id}/export:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      summary: 匯出整個 Session
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [json, markdown], default: json }
        - name: include_entries
          in: query
          description: 是否附上完整 transcript（稽核與問題重現用）。
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Session 快照
          content:
            application/json: { schema: { type: object } }
            text/markdown: { schema: { type: string } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{run_id}:
    parameters:
      - $ref: "#/components/parameters/RunID"
    get:
      summary: 取得 Run 狀態與結果
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{run_id}/events:
    parameters:
      - $ref: "#/components/parameters/RunID"
      - $ref: "#/components/parameters/LastEventID"
      - name: after_sequence
        in: query
        schema: { type: integer, format: int64, minimum: 0 }
    get:
      summary: 重播並持續訂閱 Run SSE events
      description: >-
        重播僅適用於仍保留的事件檔。啟動後與每 30 分鐘維護時，保留最新 50 筆 Run 與全部未終態 Run 的事件，
        其餘及孤兒事件檔會清理。Run metadata 也以 500 筆為整理基準，僅淘汰最舊範圍中的終態 Run；淘汰後可能回傳 404。
        memory.recalled 事件含 count、memory_ids、truncated，工具失敗後補召回另有 trigger=tool_failure，不回傳記憶本文。
      responses:
        "200":
          description: Last-Event-ID 之後的 durable event stream
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{run_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunID"
    post:
      summary: 明確取消 Run
      responses:
        "202":
          description: Run 已立即標記為 canceled 並寫入終止事件；底層 Provider 若未遵守取消，仍會在背景收尾
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{run_id}/pause:
    parameters:
      - $ref: "#/components/parameters/RunID"
    post:
      summary: 暫停 Run
      description: 將 Run 停在下一個安全回合邊界；目前進行中的 Provider 請求會先完成。
      responses:
        "202": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{run_id}/resume:
    parameters:
      - $ref: "#/components/parameters/RunID"
    post:
      summary: 恢復已暫停 Run
      responses:
        "202": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{run_id}/decision:
    parameters:
      - $ref: "#/components/parameters/RunID"
    post:
      summary: 核准或拒絕等待中的工具呼叫
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToolApprovalDecisionInput" }
      responses:
        "202":
          description: 決策已送交等待中的 Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/sessions/{session_id}/context:compact:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      summary: 手動壓縮對話歷史
      description: >-
        自動壓縮只在接近 context 上限時才觸發。使用者知道自己接下來要送出大量內容時，
        那個門檻剛好擋住他，這個端點把決定權交回去。與自動壓縮共用同一條路徑，
        因此摘要格式與 transcript 紀錄一致，只有 reason 標為 manual。
        Session 有進行中的工作時回 409：壓縮會寫入 transcript，而 Run 正在同一份 transcript 上讀寫。
        壓縮後估算不會變小（短對話的摘要可能比原文長）時保持原狀並回報 compacted=false。
      responses:
        "200":
          description: 壓縮結果；compacted 為 false 時對話未被更動
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      compacted: { type: boolean }
                      reason: { type: string, description: "manual、nothing_to_compact 或 no_reduction。" }
                      compacted_messages: { type: integer }
                      retained_messages: { type: integer }
                      estimated_tokens_before: { type: integer }
                      estimated_tokens_after: { type: integer }
                      budget_tokens: { type: integer }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/questions/{question_id}/answer:
    parameters:
      - name: question_id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: 回覆 Agent 的問答選單
      description: >-
        Agent 呼叫 ask_user 時會送出 tool.execution.update 事件（details.phase 為 user_question，
        details.question 是問題本身），並停在那裡等待。這個端點把使用者的抉擇送回去。
        問題只存在於工具等待的那段時間，不落地；工具每五秒重送一次事件，因此重新連線後仍收得到。
        取消（canceled=true）是合法答案而不是錯誤：使用者沒有義務回答，Agent 收到後會自行決定並說明假設。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                selected: { type: string, description: 選中的選項文字，必須與問題提供的其中一個 label 完全相同。 }
                custom: { type: string, description: 使用者自行輸入的答案，不受選項清單限制；與 selected 擇一。 }
                canceled: { type: boolean, default: false, description: 取消這次選擇；此時 selected 與 custom 可省略。 }
      responses:
        "202":
          description: 答案已送交等待中的工具
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      question_id: { type: string }
                      accepted: { type: boolean }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{run_id}/retry:
    parameters:
      - $ref: "#/components/parameters/RunID"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      summary: 以原始輸入建立新的重試 Run
      description: 只接受 retryable 的 failed 或 canceled Run；原 Run 保持不變。
      responses:
        "202":
          description: 新 Run 已建立
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/runs/cancel-all:
    post:
      summary: 取消所有活動中的 Run
      description: 取消 queued、running、paused 與 waiting_approval 狀態的 Run。
      responses:
        "202": { $ref: "#/components/responses/JSONData" }
        default: { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    AgentID:
      name: agent_id
      in: path
      required: true
      schema: { type: string }
    SessionID:
      name: session_id
      in: path
      required: true
      schema: { type: string }
    ScheduleID:
      name: schedule_id
      in: path
      required: true
      schema: { type: string }
    ProjectID:
      name: project_id
      in: path
      required: true
      schema: { type: string }
    WorkspaceID:
      name: workspace_id
      in: path
      required: true
      schema: { type: string }
    RunID:
      name: run_id
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string }
      description: Client 產生的唯一鍵；斷線重試時必須重用。
    LastEventID:
      name: Last-Event-ID
      in: header
      schema: { type: integer, format: int64, minimum: 0 }
      description: 最後完整處理的 Run event sequence。
  responses:
    JSONData:
      description: JSON data envelope
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {}
    Problem:
      description: RFC 9457-style problem response
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    RememberMemoryInput:
      type: object
      required: [content]
      properties:
        scope: { type: string, description: 留空時使用後端預設 scope。 }
        content: { type: string, minLength: 1 }
        kind: { type: string, enum: [fact, preference, decision, procedure, constraint], default: fact }
        tags: { type: array, items: { type: string } }
        confidence: { type: number, minimum: 0, maximum: 1, default: 1 }
        supersedes: { type: array, items: { type: string }, description: 被這筆記憶取代的舊記憶 ID。 }
        metadata: { type: object, additionalProperties: true }
    AgentDescriptor:
      type: object
      required: [id, name, version]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        description: { type: string }
        capabilities: { type: array, items: { type: string } }
    Session:
      type: object
      required: [id, agent_id, workspace_id, title, position, created_at, updated_at]
      properties:
        id: { type: string }
        agent_id: { type: string }
        workspace_id: { type: string }
        project_id: { type: string }
        title: { type: string }
        provider_id: { type: string, description: 建立時會保存實際值；未指定時複製 Workspace 預設 Provider。 }
        model: { type: string, description: 建立時會保存實際值；未指定時使用 Workspace 預設模型，再回退至 Provider 預設模型。 }
        usage: { $ref: "#/components/schemas/SessionUsage" }
        thinking_mode: { type: string, enum: [none, minimal, low, medium, high, xhigh], description: 思考程度；省略或 auto 時沿用 Provider／後端預設。 }
        lock_plans: { type: boolean, default: false, description: 是否以 Session 為單位鎖定計畫；開啟時未完成計畫必須依序執行。 }
        permission_profile: { type: string, description: 後端指派的權限 profile；決定該 Session 是否能使用高權限工具。 }
        permanent_tool_approval: { type: boolean, description: 目前 Session 是否已經由有效人工決策開啟永久工具核准；唯讀狀態，不能透過 Session PATCH 設定。 }
        pinned: { type: boolean }
        pinned_at: { type: string, format: date-time }
        position: { type: integer, minimum: 0 }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateSessionInput:
      type: object
      required: [workspace_id]
      properties:
        title: { type: string }
        workspace_id: { type: string }
        project_id: { type: string }
        provider_id: { type: string, description: 未指定或空字串時，建立的 Session 會複製 Workspace 預設 Provider；指定時可使用任一全域已啟用 Provider。 }
        model: { type: string, description: 未指定或空字串時，建立的 Session 會複製 Workspace 預設模型，再回退至 Provider 預設模型。 }
        thinking_mode: { type: string, enum: [auto, none, minimal, low, medium, high, xhigh], description: 思考程度；省略或 auto 時沿用 Provider／後端預設。 }
        lock_plans: { type: boolean, default: false, description: 是否以 Session 為單位鎖定計畫；開啟時未完成計畫必須依序執行。 }
        permission_profile: { type: string, description: 只有後端設定 permissions.allow_client_choice=true 時才可指定，且必須是後端已宣告的 profile；否則回傳 400。留空時套用後端預設 profile。 }
        pinned: { type: boolean }
        metadata: { type: object, additionalProperties: true }
    ReorderSessionsInput:
      type: object
      required: [workspace_id, session_ids]
      properties:
        workspace_id: { type: string, minLength: 1 }
        project_id: { type: string, description: 空字串或省略表示未分類。 }
        session_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 1 }
    UpdateSessionInput:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1 }
        workspace_id: { type: string, description: 搬移時 project_id 必須同屬此 Workspace。 }
        project_id: { type: string, description: 空字串表示未分類。 }
        provider_id: { type: string, description: 空字串恢復 Workspace 預設；指定時可使用任一全域已啟用 Provider。 }
        model: { type: string }
        thinking_mode: { type: string, enum: [auto, none, minimal, low, medium, high, xhigh], description: 思考程度；空字串或 auto 恢復 Provider／後端預設。 }
        lock_plans: { type: boolean, description: 是否以 Session 為單位鎖定計畫；開啟時未完成計畫必須依序執行。 }
        permission_profile: { type: string, description: 只有後端設定 permissions.allow_client_choice=true 時才可指定，且必須是後端已宣告的 profile；否則回傳 400。 }
        memory_scope: { type: string, description: 空字串會恢復 Agent 預設 scope。記憶體隔離專案的 Session 一律使用專案專屬 scope，此欄位對它無效。 }
        pinned: { type: boolean }
        position: { type: integer, minimum: 0 }
    Plan:
      type: object
      required: [id, session_id, title, status, position, created_by, steps, created_at, updated_at]
      properties:
        id: { type: string }
        session_id: { type: string }
        title: { type: string }
        objective: { type: string }
        status: { type: string, enum: [queued, active, completed, canceled] }
        position: { type: integer, minimum: 0 }
        current_step_id: { type: string }
        created_by: { type: string, enum: [user, agent] }
        steps:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/PlanStep" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PlanStep:
      type: object
      required: [id, title, verification, status]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        verification: { type: string }
        status: { type: string, enum: [pending, in_progress, verifying, completed, blocked, skipped] }
        evidence: { type: string }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
    CreatePlanInput:
      type: object
      required: [title, steps]
      properties:
        title: { type: string, minLength: 1 }
        objective: { type: string }
        steps:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [title, verification]
            properties:
              title: { type: string, minLength: 1 }
              description: { type: string }
              verification: { type: string, minLength: 1, description: 可由實際工具檢查的客觀完成條件。 }
    ReorderPlansInput:
      type: object
      required: [plan_ids]
      properties:
        plan_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
    Project:
      type: object
      required: [id, workspace_id, name, position, created_at, updated_at]
      properties:
        id: { type: string }
        workspace_id: { type: string }
        name: { type: string }
        description: { type: string }
        instructions: { type: string, maxLength: 8000, description: 職務說明；每次 Run 都會注入提示，Project 的說明接在所屬 Workspace 之後。 }
        ephemeral: { type: boolean, description: 是否使用專案專屬 RAM Disk；Project 設定保留，但底下的 Session 與相關資料在程式關閉或重啟時清除，且建立後不可變更。 }
        ram_disk_size_mb: { type: integer, minimum: 256, description: 記憶體隔離專案的 RAM Disk 容量；上限為主機實體記憶體的 75%，一般專案為 0。 }
        sandbox_roots:
          type: array
          items: { type: string }
          description: Project 允許原生檔案與 Shell 工具存取的絕對目錄；後端會解析 symlink、去重並拒絕檔案系統根目錄。
        position: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateProjectInput:
      type: object
      required: [name, workspace_id]
      properties:
        name: { type: string, minLength: 1, description: 同一 Workspace 內唯一。 }
        workspace_id: { type: string }
        description: { type: string }
        instructions: { type: string, maxLength: 8000, description: 職務說明；每次 Run 都會注入提示，Project 的說明接在所屬 Workspace 之後。 }
        ephemeral: { type: boolean, default: false, description: 建立記憶體隔離專案；Project 設定保留，但底下的 Session 與相關資料在程式關閉或重啟時清除，且建立後不可透過 PATCH 變更。 }
        ram_disk_size_mb: { type: integer, minimum: 256, default: 512, description: ephemeral=true 時適用；上限為主機實體記憶體的 75%，且不可與 sandbox_roots 同時使用。 }
        sandbox_roots:
          type: array
          items: { type: string }
          description: 可同時指定多個既有的絕對目錄；ephemeral=true 時必須為空。
    UpdateProjectInput:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        instructions: { type: string, maxLength: 8000, description: 職務說明；每次 Run 都會注入提示，Project 的說明接在所屬 Workspace 之後。 }
        sandbox_roots:
          type: array
          items: { type: string }
          description: 完整取代一般 Project 的 Sandbox 目錄集合；記憶體隔離專案不可更新此欄位。
        position: { type: integer, minimum: 0 }
    Schedule:
      type: object
      required: [id, workspace_id, agent_id, name, prompt, enabled, recurrence, position, created_at, updated_at]
      properties:
        id: { type: string }
        workspace_id: { type: string }
        agent_id: { type: string }
        name: { type: string, description: 同一 Workspace 內唯一。 }
        prompt: { type: string, description: 到點後送進新 Session 的使用者訊息。 }
        enabled: { type: boolean }
        recurrence: { $ref: "#/components/schemas/ScheduleRecurrence" }
        sandbox_roots:
          type: array
          items: { type: string }
          description: 後端驗證後才寫入的保留欄位；空陣列表示只使用該次 Session 的私有工作目錄。
        provider_id: { type: string }
        model: { type: string }
        permission_profile: { type: string }
        position: { type: integer }
        next_run_at: { type: string, format: date-time, description: 停用時不存在。 }
        last_run_at: { type: string, format: date-time }
        last_run_id: { type: string }
        last_session_id: { type: string }
        last_status: { type: string, enum: [triggered, failed] }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ScheduleRecurrence:
      type: object
      required: [frequency]
      description: 只支援固定間隔、每日與每週；每日與每週採後端所在時區的牆上時間。
      properties:
        frequency: { type: string, enum: [interval, daily, weekly] }
        interval_minutes: { type: integer, minimum: 1, maximum: 10080, description: frequency=interval 時必填。 }
        time_of_day: { type: string, pattern: "^[0-9]{2}:[0-9]{2}$", description: frequency=daily 或 weekly 時必填。 }
        weekdays:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
          description: frequency=weekly 時至少一天；0 是星期日。
    CreateScheduleInput:
      type: object
      required: [workspace_id, name, prompt, recurrence]
      properties:
        workspace_id: { type: string }
        agent_id: { type: string, description: 省略時使用後端第一個註冊的 Agent。 }
        name: { type: string, minLength: 1 }
        prompt: { type: string, minLength: 1, maxLength: 8000 }
        enabled: { type: boolean, default: true }
        recurrence: { $ref: "#/components/schemas/ScheduleRecurrence" }
        sandbox_roots:
          type: array
          items: { type: string }
          description: 可同時指定多個既有的絕對目錄；驗證方式與 Project 相同。
        provider_id: { type: string }
        model: { type: string }
        permission_profile: { type: string }
    UpdateScheduleInput:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        prompt: { type: string, minLength: 1, maxLength: 8000 }
        enabled: { type: boolean }
        recurrence: { $ref: "#/components/schemas/ScheduleRecurrence" }
        sandbox_roots:
          type: array
          items: { type: string }
        provider_id: { type: string }
        model: { type: string }
        permission_profile: { type: string }
        position: { type: integer, minimum: 0 }
    Workspace:
      type: object
      required: [id, name, provider_ids, default_provider_id, position, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        instructions: { type: string, maxLength: 8000, description: 職務說明；每次 Run 都會注入提示，Project 的說明接在所屬 Workspace 之後。 }
        provider_ids: { type: array, minItems: 1, uniqueItems: true, items: { type: string }, description: Workspace 自己管理的 Provider 集合與預設來源，不限制 Session override。 }
        default_provider_id: { type: string, description: 必須存在於 provider_ids；作為新對話與未指定 override 時的預設值。 }
        model: { type: string }
        position: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateWorkspaceInput:
      type: object
      required: [name, provider_ids, default_provider_id]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        instructions: { type: string, maxLength: 8000, description: 職務說明；每次 Run 都會注入提示，Project 的說明接在所屬 Workspace 之後。 }
        provider_ids: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
        default_provider_id: { type: string }
        model: { type: string }
    UpdateWorkspaceInput:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        instructions: { type: string, maxLength: 8000, description: 職務說明；每次 Run 都會注入提示，Project 的說明接在所屬 Workspace 之後。 }
        provider_ids: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
        default_provider_id: { type: string, minLength: 1 }
        model: { type: string }
        position: { type: integer, minimum: 0 }
    ProviderDescriptor:
      type: object
      required: [id, display_name, protocol, endpoint, default_model, streaming, has_api_key, supports_native_tool_calls]
      properties:
        id: { type: string }
        display_name: { type: string, minLength: 1, maxLength: 80 }
        protocol: { type: string }
        endpoint: { type: string, format: uri }
        default_model: { type: string }
        streaming: { type: boolean }
        has_api_key: { type: boolean }
        supports_native_tool_calls:
          type: boolean
          description: Provider 是否能可靠使用協定原生的工具呼叫欄位。
    ServiceSettings:
      type: object
      required: [service_name, ui_language, notifications_enabled, max_wall_clock_seconds, max_tokens, max_tool_calls]
      properties:
        service_name: { type: string, minLength: 1, maxLength: 80 }
        ui_language: { type: string, enum: [auto, zh-TW, en, ja, ko] }
        notifications_enabled: { type: boolean, description: 預設 false；關閉時不建立或顯示通知中心摘要。 }
        max_wall_clock_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          description: 單次工作的牆鐘時間上限（秒）。
        max_tokens:
          type: integer
          minimum: 0
          description: 單次工作累計 Token 上限；0 表示不限制。
        max_tool_calls:
          type: integer
          minimum: 0
          maximum: 10000
          description: 單次工作工具呼叫上限；0 表示不限制。
        http_fetch: { $ref: "#/components/schemas/HTTPFetchSettings" }
        extended_tools: { type: boolean, description: 預設 false。精簡集合已含文件檢視、讀取、建立與轉換；編輯、SSH、記憶等工具需擴充集合，仍受 allowlist 限制。工具檢索另由 tool_retrieval 控制。 }
        tool_call_mode: { type: string, enum: [native, instruction], description: native 使用 Provider 的 tool_calls 欄位；Provider 不支援時才用 instruction。 }
        tool_retrieval: { type: boolean, description: 預設 true。工具目錄先經檢索，只有與本次需求相關的工具進入提示（內建工具與 MCP 工具都適用）；其餘工具仍可由模型以 find_tools 取回後直接呼叫。關閉後整份目錄會進入每一次請求。 }
        memory_space: { type: boolean, default: false, description: 實驗性功能。Agent 記憶工具套用種類／憑證樣式檢查及近似去重，預設 scope 優先 Project、其次 Workspace，明確 memory_scope 優先（記憶體隔離 Session 除外，一律使用專案專屬 scope 且記憶不落地）。自動召回預設最多 6 筆與 1200 UTF-8 bytes 注入預算及綜合排序門檻；scope 超量時軟性淘汰。仍受既有 memory 設定限制，手動記憶 API 不套用此策略。切換不搬移既有資料，30 天失效記憶清理則獨立執行。 }
        memory_isolated_projects: { type: boolean, default: true, description: 是否允許新建記憶體隔離專案。關閉只擋新建；既有隔離專案的 RAM disk、對話與關閉時清理都照常運作，避免一次誤關讓使用者現有專案失效。可在缺少 RAM disk 支援的環境（Windows 需 ImDisk）整個關閉。 }
    HTTPFetchSettings:
      type: object
      required: [enabled, allow_private_networks]
      description: http_fetch 是唯一可由模型自行指定任意 URL 的原生工具，因此可由管理介面即時開關。
      properties:
        enabled: { type: boolean, description: 關閉時工具不會出現在模型的工具清單，執行請求也會被拒絕。 }
        allow_private_networks: { type: boolean, description: 預設 true；開啟時允許連線到 localhost、loopback、私有網段、link-local 與 CGNAT 位址，關閉時拒絕上述位址。 }
    UpdateServiceSettingsInput:
      type: object
      required: [service_name]
      properties:
        service_name: { type: string, minLength: 1, maxLength: 80 }
        ui_language: { type: string, enum: [auto, zh-TW, en, ja, ko] }
        notifications_enabled: { type: boolean, description: 是否啟用通知中心；省略時保留目前設定。 }
        max_wall_clock_seconds: { type: integer, minimum: 1, maximum: 86400 }
        max_tokens: { type: integer, minimum: 0 }
        max_tool_calls: { type: integer, minimum: 0, maximum: 10000 }
        http_fetch_enabled: { type: boolean, description: 省略時保留目前設定。 }
        http_fetch_allow_private_networks: { type: boolean, description: 省略時保留目前設定。 }
        extended_tools: { type: boolean, description: 省略時保留目前設定。 }
        tool_call_mode: { type: string, enum: [native, instruction], description: 省略時保留目前設定。 }
        tool_retrieval: { type: boolean, description: 省略時保留目前設定。 }
        memory_space: { type: boolean, description: 省略時保留目前設定；切換立即生效，不必重啟後端。 }
        memory_isolated_projects: { type: boolean, description: 省略時保留目前設定；切換立即生效，不必重啟後端。關閉後建立隔離專案會得到 409。 }
    ProviderSettings:
      type: object
      required: [default_provider_id, providers]
      properties:
        default_provider_id: { type: string }
        providers:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ProviderSetting" }
    UpdateProviderSettingsInput:
      allOf:
        - $ref: "#/components/schemas/ProviderSettings"
    MCPSettings:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items: { $ref: "#/components/schemas/MCPServerSetting" }
    UpdateMCPSettingsInput:
      allOf:
        - $ref: "#/components/schemas/MCPSettings"
    MCPServerSetting:
      type: object
      required: [id, enabled, transport, startup_timeout_seconds, call_timeout_seconds]
      properties:
        id: { type: string, pattern: "^[A-Za-z0-9_-]+$", maxLength: 80 }
        display_name: { type: string, maxLength: 80 }
        enabled: { type: boolean }
        transport: { type: string, enum: [stdio, sse, streamable-http] }
        command: { type: string }
        args: { type: array, items: { type: string } }
        environment: { type: object, additionalProperties: { type: string }, writeOnly: true }
        has_environment: { type: boolean, readOnly: true }
        work_dir: { type: string }
        url: { type: string, format: uri }
        api_key: { type: string, writeOnly: true, description: 遠端 HTTP／SSE Bearer Token；省略時保留，空字串清除。 }
        has_api_key: { type: boolean, readOnly: true }
        username: { type: string, writeOnly: true, description: 遠端 HTTP／SSE Basic Auth 帳號；省略時保留，空字串清除。 }
        password: { type: string, writeOnly: true, description: 遠端 HTTP／SSE Basic Auth 密碼；省略時保留，空字串清除。 }
        has_basic_auth: { type: boolean, readOnly: true }
        headers: { type: object, additionalProperties: { type: string }, writeOnly: true }
        has_headers: { type: boolean, readOnly: true }
        startup_timeout_seconds: { type: integer, minimum: 1, maximum: 300 }
        call_timeout_seconds: { type: integer, minimum: 1, maximum: 86400, description: 沒有回應或進度更新的容忍秒數；MCP Server 持續回報進度時不會被截斷。 }
        trust_annotations: { type: boolean }
        auth_mode: { type: string, readOnly: true, enum: [none, bearer, basic, headers], description: 後端實際送出的驗證方式；憑證明文不會回傳。 }
        status: { type: string, readOnly: true }
        error: { type: string, readOnly: true }
        tool_count: { type: integer, readOnly: true }
        tools:
          type: array
          readOnly: true
          description: 目前公開給模型的工具。
          items: { $ref: "#/components/schemas/MCPToolSetting" }
        available_tools:
          type: array
          readOnly: true
          description: Server 提供的完整工具清單，供管理介面挑選。
          items: { $ref: "#/components/schemas/MCPToolSetting" }
        enabled_tools:
          type: array
          items: { type: string }
          description: 要公開給模型的工具（remote name）。空陣列代表全部公開；省略時保留目前設定。
        updated_at: { type: string, format: date-time, readOnly: true }
    MCPToolSetting:
      type: object
      required: [name]
      properties:
        name: { type: string }
        display_name: { type: string }
    MCPTestResult:
      type: object
      required: [id, ok, status, tool_count]
      properties:
        id: { type: string }
        ok: { type: boolean }
        status: { type: string }
        tool_count: { type: integer }
        tools: { type: array, items: { $ref: "#/components/schemas/MCPToolSetting" } }
        error: { type: string }
    ReverseProxyStatus:
      type: object
      required:
        - runtime_checked
        - available
        - running
        - connected
        - endpoint
        - api_key_set
        - target_port
      properties:
        runtime_checked: { type: boolean }
        available: { type: boolean, description: 目前平台的 NetPassClient Runtime 是否存在且可執行。 }
        running: { type: boolean }
        connected: { type: boolean }
        endpoint: { type: string, format: uri }
        api_key_set: { type: boolean }
        name: { type: string }
        target_port: { type: integer, minimum: 1, maximum: 65535, description: 後端 API Port；公開前應另外設定後端 Bearer Token。 }
        pid: { type: integer }
        client_id: { type: string }
        public_url: { type: string, format: uri }
        started_at: { type: string, format: date-time }
        last_error: { type: string }
    UpdateReverseProxyInput:
      type: object
      properties:
        endpoint: { type: string, format: uri, default: "https://netpass.mars-cloud.com" }
        api_key: { type: string, writeOnly: true, description: 留白時保留既有值。 }
        clear_api_key: { type: boolean, default: false }
        name: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{1,62}[A-Za-z0-9]$" }
    StartReverseProxyInput:
      type: object
      required: [accept_usage_policy]
      properties:
        accept_usage_policy: { type: boolean, description: 必須為 true，表示已理解公共網路暴露風險。 }
    ProviderSetting:
      type: object
      required: [id, type, enabled]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        display_name: { type: string, maxLength: 80, description: 顯示於清單與選擇器的名稱；空白時使用 Provider ID。 }
        type: { type: string, enum: [openai-compatible, openai-codex-responses] }
        enabled: { type: boolean, description: 停用後保留設定，但不提供給 Workspace、Session 或新模型請求使用。 }
        openai_compatible: { $ref: "#/components/schemas/OpenAICompatibleProviderSetting" }
        openai_codex_responses: { $ref: "#/components/schemas/OpenAICodexResponsesProviderSetting" }
    OpenAICompatibleProviderSetting:
      type: object
      required: [base_url, model, instruction_role, max_attempts]
      properties:
        base_url: { type: string, format: uri }
        api_key: { type: string, writeOnly: true, description: 省略時保留，空字串清除。 }
        has_api_key: { type: boolean, readOnly: true }
        model: { type: string, minLength: 1 }
        instruction_role: { type: string, enum: [system, developer] }
        disable_streaming: { type: boolean }
        stream_include_usage: { type: boolean }
        omit_tool_choice: { type: boolean }
        max_attempts: { type: integer, minimum: 1, maximum: 3 }
        timeout_seconds: { type: integer, minimum: 1 }
        connect_timeout_seconds: { type: integer, minimum: 1 }
        response_header_timeout_seconds: { type: integer, minimum: 1 }
        context_window: { type: integer, minimum: 0 }
        max_output_tokens: { type: integer, minimum: 0 }
    OpenAICodexResponsesProviderSetting:
      type: object
      required: [model, max_attempts]
      properties:
        has_oauth_token: { type: boolean, readOnly: true }
        model: { type: string, minLength: 1, default: gpt-5.2-codex }
        max_attempts: { type: integer, minimum: 1, maximum: 3 }
        timeout_seconds: { type: integer, minimum: 1 }
        connect_timeout_seconds: { type: integer, minimum: 1 }
        response_header_timeout_seconds: { type: integer, minimum: 1 }
        context_window: { type: integer, minimum: 0 }
        max_output_tokens: { type: integer, minimum: 0 }
    Usage:
      type: object
      properties:
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
    ModelPrice:
      type: object
      required: [input_per_million, output_per_million]
      properties:
        input_per_million: { type: number, minimum: 0, description: 每百萬輸入 token 的美元價格。 }
        output_per_million: { type: number, minimum: 0, description: 每百萬輸出 token 的美元價格。 }
        currency: { type: string, enum: [USD], default: USD }
    RunUsage:
      type: object
      properties:
        provider_id: { type: string }
        model: { type: string }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
        estimated_cost_usd: { type: number, minimum: 0, description: 未設定價格時省略。 }
        currency: { type: string, enum: [USD] }
    SessionUsage:
      type: object
      description: 由目前保留的 Run 用量快照彙總，非終身帳務紀錄；舊 Run 被清理後不再計入。
      required: [input_tokens, output_tokens, total_tokens]
      properties:
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
        estimated_cost_usd: { type: number, minimum: 0, description: 所有有用量的 Run 都有價格時才提供。 }
        currency: { type: string, enum: [USD] }
        by_model:
          type: array
          items: { $ref: "#/components/schemas/RunUsage" }
    ModelCapabilities:
      type: object
      required: [supports_tools, streaming]
      properties:
        context_window: { type: integer, minimum: 0 }
        max_output_tokens: { type: integer, minimum: 0 }
        supports_tools: { type: boolean }
        streaming: { type: boolean }
    ProviderModels:
      type: object
      required: [provider_id, models]
      properties:
        provider_id: { type: string }
        models:
          type: array
          uniqueItems: true
          items: { type: string }
    ProviderUsageWindow:
      type: object
      required: [available, remaining_percent]
      properties:
        available: { type: boolean }
        remaining_percent: { type: number, minimum: 0, maximum: 100 }
        window_minutes: { type: integer, minimum: 1 }
        reset_at: { type: string, format: date-time }
    ProviderUsage:
      type: object
      required: [provider_id, five_hour, seven_day]
      properties:
        provider_id: { type: string }
        updated_at: { type: string, format: date-time }
        five_hour: { $ref: "#/components/schemas/ProviderUsageWindow" }
        seven_day: { $ref: "#/components/schemas/ProviderUsageWindow" }
    ProviderTestResult:
      type: object
      required: [ok, tool_calling, provider_id, model, duration_milliseconds, usage]
      properties:
        ok: { type: boolean }
        tool_calling: { type: boolean, description: 是否已實際收到原生工具呼叫。 }
        provider_id: { type: string }
        model: { type: string }
        provider_request_id: { type: string }
        response_preview: { type: string }
        duration_milliseconds: { type: integer, minimum: 0 }
        usage: { $ref: "#/components/schemas/Usage" }
        models:
          type: array
          uniqueItems: true
          items: { type: string }
        warning: { type: string }
    ProviderOAuthStartResult:
      type: object
      required: [provider_id, status, authorization_url, callback_uri, browser_opened, expires_at]
      properties:
        provider_id: { type: string }
        status: { type: string, enum: [pending] }
        authorization_url: { type: string, format: uri }
        callback_uri: { type: string, format: uri }
        browser_opened: { type: boolean }
        expires_at: { type: string, format: date-time }
    ProviderOAuthStatus:
      type: object
      required: [provider_id, status]
      properties:
        provider_id: { type: string }
        status: { type: string, enum: [idle, pending, connected, failed] }
        message: { type: string }
        account_email: { type: string }
        account_name: { type: string }
        expires_at: { type: string, format: date-time }
    RunInput:
      type: object
      required: [input]
      properties:
        input: { type: string, minLength: 1 }
        attachment_ids:
          type: array
          maxItems: 16
          uniqueItems: true
          items: { type: string }
        provider_id: { type: string, description: Run override；可指定任一全域已啟用 Provider，未指定時沿用 Session／Workspace 預設。 }
        model: { type: string }
        thinking_mode: { type: string, enum: [auto, none, minimal, low, medium, high, xhigh], description: Run override；未指定時沿用 Session，空字串或 auto 表示使用 Provider／後端預設。 }
        metadata: { type: object, additionalProperties: true }
    Run:
      type: object
      required: [id, agent_id, session_id, status, input, created_at]
      properties:
        id: { type: string }
        agent_id: { type: string }
        session_id: { type: string }
        status: { type: string, enum: [queued, running, paused, waiting_approval, completed, failed, canceled] }
        input: { type: string }
        attachment_ids:
          type: array
          items: { type: string }
        provider_id: { type: string }
        model: { type: string }
        idempotency_key: { type: string }
        idempotency_fingerprint: { type: string, description: 伺服器用來判斷重送內容是否相同的指紋。 }
        result: { $ref: "#/components/schemas/RunResult" }
        usage: { $ref: "#/components/schemas/RunUsage" }
        error: { type: object, additionalProperties: true }
        pending_approval: { $ref: "#/components/schemas/ToolApprovalRequest" }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
    Notification:
      type: object
      required: [id, type, level, title, message, read, created_at]
      properties:
        id: { type: string }
        type: { type: string }
        level: { type: string, enum: [info, success, warning, error] }
        title: { type: string }
        message: { type: string }
        read: { type: boolean }
        run_id: { type: string }
        session_id: { type: string }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    UpdateStatus:
      type: object
      required: [current_version, available, checked_at]
      properties:
        current_version: { type: string }
        latest_version: { type: string }
        available: { type: boolean }
        release_name: { type: string }
        release_url: { type: string, format: uri }
        published_at: { type: string, format: date-time }
        checked_at: { type: string, format: date-time }
        check_error: { type: string }
    SearchResult:
      type: object
      required: [kind, id, title, snippet, created_at]
      properties:
        kind: { type: string, enum: [workspace, project, session, message, plan, schedule] }
        id: { type: string }
        title: { type: string }
        snippet: { type: string }
        workspace_id: { type: string }
        project_id: { type: string }
        session_id: { type: string }
        created_at: { type: string, format: date-time }
    ToolPermissionInfo:
      type: object
      required: [name, permission, requires_permission, read_only, available]
      properties:
        name: { type: string }
        permission: { type: string, enum: [standard, elevated] }
        requires_permission: { type: boolean }
        read_only: { type: boolean }
        available: { type: boolean }
    PermissionCenter:
      type: object
      required: [policy, tools, waiting_approval_runs]
      properties:
        policy: { $ref: "#/components/schemas/PermissionPolicy" }
        tools: { type: array, items: { $ref: "#/components/schemas/ToolPermissionInfo" } }
        waiting_approval_runs: { type: integer, minimum: 0 }
    PermissionPolicy:
      type: object
      required: [default_profile, allow_client_choice]
      properties:
        default_profile: { type: string }
        elevated_profiles: { type: array, items: { type: string } }
        allow_client_choice: { type: boolean }
    RestoreResult:
      type: object
      required: [restart_required, restored, excluded]
      properties:
        restart_required: { type: boolean }
        restored: { type: array, items: { type: string } }
        excluded: { type: array, items: { type: string } }
    Attachment:
      type: object
      required: [id, session_id, name, path, size, created_at]
      properties:
        id: { type: string }
        session_id: { type: string }
        name: { type: string }
        media_type: { type: string }
        path: { type: string, description: Session Sandbox 內由後端產生的絕對路徑。 }
        size: { type: integer, format: int64, minimum: 0 }
        created_at: { type: string, format: date-time }
    RunResult:
      type: object
      required: [message]
      properties:
        message: { $ref: "#/components/schemas/Message" }
        usage: { $ref: "#/components/schemas/RunUsage" }
        budget_exceeded: { $ref: "#/components/schemas/RunBudgetExceeded" }
        completion: { $ref: "#/components/schemas/RunCompletion" }
    Message:
      type: object
      required: [id, session_id, role, created_at]
      properties:
        id: { type: string }
        session_id: { type: string }
        role: { type: string, enum: [user, assistant, tool] }
        content: { type: string }
        reasoning:
          type: string
          description: Provider 回傳且可供使用者檢視的 reasoning 內容。
        tool_calls:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
              arguments: { type: object, additionalProperties: true }
        tool_call_id: { type: string }
        tool_name: { type: string }
        is_error: { type: boolean }
        provider_id: { type: string }
        provider_request_id: { type: string }
        model: { type: string }
        stop_reason: { type: string }
        usage:
          type: object
          properties:
            input_tokens: { type: integer }
            output_tokens: { type: integer }
            total_tokens: { type: integer }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    RunCompletion:
      type: object
      description: >-
        這次 Run 的完成度判定。checks_performed 大於 0 代表模型曾宣稱完成但被追問；
        unresolved_failures 非空代表仍有工具失敗沒有後續成功的同名呼叫，
        呼叫端應據此判斷這次「完成」的可信度。
      required: [checks_performed]
      properties:
        checks_performed: { type: integer }
        unresolved_failures:
          type: array
          items:
            type: object
            required: [tool_call_id, tool_name]
            properties:
              tool_call_id: { type: string }
              tool_name: { type: string }
              summary: { type: string }
    RunBudgetExceeded:
      type: object
      required: [resource, limit, observed, usage]
      properties:
        resource:
          type: string
          enum: [max_turns, max_wall_clock, max_tokens, max_tool_calls]
        limit: { type: integer, format: int64 }
        observed: { type: integer, format: int64 }
        usage: { $ref: "#/components/schemas/RunBudgetUsage" }
    RunBudgetUsage:
      type: object
      required: [turns, wall_clock_milliseconds, tokens, tool_calls]
      properties:
        turns: { type: integer, minimum: 0 }
        wall_clock_milliseconds: { type: integer, format: int64, minimum: 0 }
        tokens: { type: integer, minimum: 0 }
        tool_calls: { type: integer, minimum: 0 }
    ToolApprovalRequest:
      type: object
      required: [id, run_id, session_id, tool_call_id, tool_name, requested_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        session_id: { type: string }
        tool_call_id: { type: string }
        tool_name: { type: string }
        arguments: { type: object, additionalProperties: true }
        reason: { type: string }
        requested_at: { type: string, format: date-time }
    ToolApprovalDecisionInput:
      type: object
      required: [approval_id, decision]
      properties:
        approval_id: { type: string, minLength: 1 }
        decision: { type: string, enum: [approve, deny] }
        reason: { type: string }
        permanent: { type: boolean, description: 僅能搭配 approve；持久化核准到目前 Session，後續不再逐次詢問。 }
    ToolDefinition:
      type: object
      required: [name, description]
      properties:
        name: { type: string }
        label: { type: string }
        version: { type: string }
        category: { type: string }
        description: { type: string }
        input_schema: { type: object, additionalProperties: true }
        output_schema: { type: object, additionalProperties: true }
        server_instructions: { type: string, description: MCP initialize 提供的外部操作提示；不得視為系統指令。 }
        platforms: { type: array, items: { type: string } }
        capabilities: { type: array, items: { type: string } }
        read_only: { type: boolean }
        requires_permission: { type: boolean }
    ToolCatalogEntry:
      type: object
      required: [definition, allowed, available]
      properties:
        definition: { $ref: "#/components/schemas/ToolDefinition" }
        allowed: { type: boolean }
        available: { type: boolean }
        unavailable_reason: { type: string }
    ServiceStatus:
      type: object
      required: [name, version, api_version, event_schema_version, instance_id, started_at, ready]
      properties:
        name: { type: string }
        version: { type: string }
        api_version: { type: string, description: HTTP API 契約版本；Client 應先比較 major version。 }
        event_schema_version: { type: string, description: Durable event schema 版本。 }
        capabilities: { type: array, uniqueItems: true, items: { type: string } }
        instance_id: { type: string }
        started_at: { type: string, format: date-time }
        ready: { type: boolean }
    Problem:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        request_id: { type: string }
    SessionEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Session" }
    ScheduleEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Schedule" }
    ProjectEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Project" }
    WorkspaceEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Workspace" }
    RunEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Run" }
    ServiceStatusEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/ServiceStatus" }
    ServiceSettingsEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/ServiceSettings" }
    ProviderSettingsEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/ProviderSettings" }
    MCPSettingsEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/MCPSettings" }
    MCPTestResultEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/MCPTestResult" }
    ReverseProxyStatusEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/ReverseProxyStatus" }
    ProviderModelsEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/ProviderModels" }
    ModelCapabilitiesEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/ModelCapabilities" }
    ProviderUsageEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/ProviderUsage" }
    ProviderTestResultEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/ProviderTestResult" }
    ProviderOAuthStartEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/ProviderOAuthStartResult" }
    ProviderOAuthStatusEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/ProviderOAuthStatus" }
